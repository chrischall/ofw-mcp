name: release-please

# Thin stub: release-please runs here; the publish steps are the
# chrischall/workflows mcp-publish composite action. The publish job stays
# in THIS file (not a reusable workflow) because npm trusted publishing and
# mcp-publisher bind to this repo's workflow identity via OIDC.
#
# The release PR ships via `release-ready`: adding it starts the auto-review,
# and a passing review arms `ready-to-merge` → deferred CI → auto-merge. CI does
# not run until the review passes, so `release-ready` is "review then ship", not
# an instant CI arm.
# The PAT (not GITHUB_TOKEN) so the release PR's events trigger CI/review.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write    # npm provenance + mcp-publisher OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: chrischall/workflows/.github/actions/mcp-publish@main
        with:
          version: ${{ needs.release-please.outputs.version }}
          tag-name: ${{ needs.release-please.outputs.tag_name }}
          # skill-path pins ONE skill in a repo that ships several: only that
          # skill is packaged and published, and it keeps the repo-level slug.
          # Without it mcp-publish publishes EVERY skills/*/SKILL.md, each under
          # its own directory-name slug. It is NOT required to avoid a failure —
          # that hard error was removed in #56 (see docs/fleet-conventions.md).
          # The value comes from `skill_path` in fleet.json (issue #76), so
          # re-rendering can't silently drop the pin and quietly start shipping
          # the repo's other skills under new slugs.
          skill-path: skills/ofw/SKILL.md
          clawhub-token: ${{ secrets.CLAWHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
